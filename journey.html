<script>

  const LANDA_STORAGE_KEY = 'landa_uk_relocation_v1';
  const DEPARTURE_AIRPORTS_BY_COUNTRY = {"United States":[{"code":"JFK","name":"John F. Kennedy International","city":"New York"},{"code":"EWR","name":"Newark Liberty International","city":"Newark / NYC"},{"code":"BOS","name":"Boston Logan International","city":"Boston"},{"code":"ORD","name":"Chicago O'Hare International","city":"Chicago"},{"code":"SFO","name":"San Francisco International","city":"San Francisco"},{"code":"LAX","name":"Los Angeles International","city":"Los Angeles"},{"code":"IAD","name":"Washington Dulles International","city":"Washington, D.C."},{"code":"ATL","name":"Hartsfield-Jackson Atlanta","city":"Atlanta"}],"Canada":[{"code":"YYZ","name":"Toronto Pearson International","city":"Toronto"},{"code":"YVR","name":"Vancouver International","city":"Vancouver"},{"code":"YUL","name":"Montréal-Trudeau International","city":"Montreal"},{"code":"YYC","name":"Calgary International","city":"Calgary"}],"Australia":[{"code":"SYD","name":"Sydney Kingsford Smith","city":"Sydney"},{"code":"MEL","name":"Melbourne Tullamarine","city":"Melbourne"},{"code":"BNE","name":"Brisbane Airport","city":"Brisbane"},{"code":"PER","name":"Perth Airport","city":"Perth"}],"Germany":[{"code":"FRA","name":"Frankfurt Airport","city":"Frankfurt"},{"code":"MUC","name":"Munich Airport","city":"Munich"},{"code":"BER","name":"Berlin Brandenburg","city":"Berlin"},{"code":"DUS","name":"Düsseldorf Airport","city":"Düsseldorf"}],"France":[{"code":"CDG","name":"Paris Charles de Gaulle","city":"Paris"},{"code":"ORY","name":"Paris Orly","city":"Paris"},{"code":"LYS","name":"Lyon-Saint Exupéry","city":"Lyon"},{"code":"NCE","name":"Nice Côte d’Azur","city":"Nice"}],"Singapore":[{"code":"SIN","name":"Singapore Changi Airport","city":"Singapore"}],"India":[{"code":"DEL","name":"Indira Gandhi International","city":"New Delhi"},{"code":"BOM","name":"Chhatrapati Shivaji Maharaj","city":"Mumbai"},{"code":"BLR","name":"Kempegowda International","city":"Bengaluru"},{"code":"MAA","name":"Chennai International","city":"Chennai"}],"Brazil":[{"code":"GRU","name":"São Paulo/Guarulhos","city":"São Paulo"},{"code":"GIG","name":"Rio de Janeiro/Galeão","city":"Rio de Janeiro"}],"Ireland":[{"code":"DUB","name":"Dublin Airport","city":"Dublin"},{"code":"ORK","name":"Cork Airport","city":"Cork"},{"code":"SNN","name":"Shannon Airport","city":"Shannon"}],"Japan":[{"code":"HND","name":"Tokyo Haneda Airport","city":"Tokyo"},{"code":"NRT","name":"Tokyo Narita International","city":"Tokyo"},{"code":"KIX","name":"Kansai International","city":"Osaka"}]};
  const EMPTY_STATE = {
    firstName: '',
    originCountry: '',
    destinationCity: '',
    purpose: null,
    household: null,
    familyMembers: [],
    onboardingCompleted: false,
    departureAirport: '',
    arrivalAirport: '',
    arrivalDate: '',
    estimatedDirectFlightGbp: null,
    estimatedFlightSource: '',
    estimatedFlightCarrier: '',
    travelingWithPets: false,
    petPassportReady: false,
    selectedTransportId: null,
    transportConfirmedAt: null,
    completedTasks: {},
    completedPriorityItems: {}
  };

  function getLandaState() {
    try {
      const raw = localStorage.getItem(LANDA_STORAGE_KEY);
      if (!raw) return structuredClone(EMPTY_STATE);
      return { ...structuredClone(EMPTY_STATE), ...JSON.parse(raw) };
    } catch {
      return structuredClone(EMPTY_STATE);
    }
  }

  function saveLandaState(next) {
    localStorage.setItem(LANDA_STORAGE_KEY, JSON.stringify(next));
  }

  function resetLandaState() {
    localStorage.removeItem(LANDA_STORAGE_KEY);
  }

  const ALL_TASK_IDS = [
    'c1-flight','c1-luggage','c1-touchdown',
    'c2-right-to-rent','c2-neighborhood','c2-deposit',
    'c3-sim','c3-bank','c3-council',
    'c4-nhs','c4-ni','c4-transit',
    'c5-community','c5-explore'
  ];

  function getProgressPercent(state) {
    const total = ALL_TASK_IDS.length + 1;
    let done = state.onboardingCompleted ? 1 : 0;
    ALL_TASK_IDS.forEach(id => { if (state.completedTasks && state.completedTasks[id]) done++; });
    return Math.round((done / total) * 100);
  }

  function getDaysUntil(dateStr) {
    if (!dateStr) return null;
    const t = new Date(dateStr + 'T00:00:00');
    if (isNaN(t.getTime())) return null;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.ceil((t.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
  }

  function getArrivalAirportIata(arrivalAirport) {
    if (!arrivalAirport) return 'LHR';
    const lower = String(arrivalAirport).toLowerCase();
    if (lower === 'heathrow') return 'LHR';
    if (lower === 'gatwick') return 'LGW';
    if (lower === 'manchester') return 'MAN';
    if (/^[a-z]{3}$/.test(lower)) return lower.toUpperCase();
    return 'LHR';
  }

  function getTravelerCount(state) {
    if (state.household === 'couple') return 2;
    if (state.household === 'family') return Math.max(1, 1 + ((state.familyMembers && state.familyMembers.length) || 0));
    return 1;
  }

  function buildSkyscannerSearchUrl(dep, arr, dateStr) {
    const d = (dep || '').trim().toLowerCase();
    const a = getArrivalAirportIata(arr || 'Heathrow').toLowerCase();
    const yymmdd = dateStr ? dateStr.replace(/-/g, '').slice(2, 8) : '';
    if (/^[a-z]{3}$/.test(d) && /^[a-z]{3}$/.test(a) && /^\d{6}$/.test(yymmdd)) {
      return 'https://www.skyscanner.net/transport/flights/' + d + '/' + a + '/' + yymmdd + '/?adults=1&preferdirects=true';
    }
    return 'https://www.skyscanner.net/flights';
  }

  const BASE_FARES = {
    'United States': { baseGbp: 520, carrier: 'British Airways / Virgin Atlantic' },
    'Canada': { baseGbp: 495, carrier: 'Air Canada / British Airways' },
    'Australia': { baseGbp: 980, carrier: 'Qantas Direct' },
    'Germany': { baseGbp: 145, carrier: 'Lufthansa / British Airways' },
    'France': { baseGbp: 128, carrier: 'Air France / British Airways' },
    'Singapore': { baseGbp: 790, carrier: 'Singapore Airlines Direct' },
    'India': { baseGbp: 560, carrier: 'British Airways / Air India' },
    'Brazil': { baseGbp: 695, carrier: 'British Airways / LATAM' },
    'Ireland': { baseGbp: 78, carrier: 'Aer Lingus / British Airways' },
    'Japan': { baseGbp: 845, carrier: 'JAL / British Airways' }
  };

  const AIRPORT_DELTAS = {
    SFO:115, LAX:110, ORD:45, ATL:55, IAD:35, BOS:-15, JFK:0, EWR:-10,
    YVR:95, YYC:65, YUL:20, YYZ:0, PER:70, BNE:40, MEL:25, SYD:0,
    MUC:18, BER:12, DUS:-8, FRA:0, LYS:22, NCE:28, ORY:-6, CDG:0,
    MAA:42, BLR:35, BOM:12, DEL:0, GIG:25, GRU:0, ORK:14, SNN:18, DUB:0,
    KIX:45, NRT:15, HND:0, SIN:0
  };

  function computeIndicativeDirectFlight(originCountry, depIata, arrName, dateStr, travelers) {
    const info = BASE_FARES[originCountry] || { baseGbp: 460, carrier: 'Skyscanner Direct Carrier' };
    let fare = info.baseGbp + (AIRPORT_DELTAS[depIata] || 0);
    const arrCode = getArrivalAirportIata(arrName);
    if (arrCode === 'LGW') fare -= 24;
    if (arrCode === 'MAN') fare += 18;
    if (dateStr) {
      const parsed = new Date(dateStr + 'T00:00:00');
      if (!isNaN(parsed.getTime())) {
        const m = parsed.getMonth();
        const mult = [0.9, 0.88, 0.94, 1.04, 1.08, 1.24, 1.34, 1.32, 1.05, 0.96, 0.91, 1.28];
        fare *= (mult[m] || 1);
        const dow = parsed.getDay();
        if (dow === 5 || dow === 6 || dow === 0) fare *= 1.09;
        else if (dow === 2 || dow === 3) fare *= 0.94;
        const daysOut = getDaysUntil(dateStr);
        const dOut = daysOut === null ? 30 : daysOut;
        if (dOut <= 7) fare *= 1.38;
        else if (dOut <= 21) fare *= 1.18;
        else if (dOut >= 90) fare *= 0.92;
        const variance = ((parsed.getDate() * 13 + m * 7) % 23) - 11;
        fare += variance;
      }
    }
    const priceGbp = Math.max(45, Math.round(fare));
    const safeT = Math.max(1, travelers || 1);
    return { priceGbp, totalPriceGbp: priceGbp * safeT, carrierName: info.carrier, source: 'indicative_estimate' };
  }

  async function fetchSkyscannerEstimate(stateObj) {
    const travelers = getTravelerCount(stateObj);
    const arrCode = getArrivalAirportIata(stateObj.arrivalAirport || 'Heathrow');
    try {
      const res = await fetch('/api/skyscanner/indicative', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          originCountry: stateObj.originCountry || '',
          departureIata: stateObj.departureAirport || '',
          arrivalIata: arrCode,
          arrivalDate: stateObj.arrivalDate,
          travelers
        })
      });
      if (res.ok) {
        const data = await res.json();
        if (typeof data.priceGbp === 'number') {
          return {
            priceGbp: data.priceGbp,
            totalPriceGbp: data.priceGbp * travelers,
            carrierName: data.carrierName || 'Direct Carrier',
            source: data.source || 'indicative_estimate'
          };
        }
      }
    } catch {}
    return computeIndicativeDirectFlight(stateObj.originCountry || '', stateObj.departureAirport || '', arrCode, stateObj.arrivalDate, travelers);
  }

  const CHAPTERS = [
    {
      number: 1, icon: 'flight', title: 'Transport to the UK',
      summary: 'Coordinate your arrival airport, target date, baggage or pet needs, and travel itinerary.',
      tasks: [
        { id: 'c1-flight', label: 'Select arrival airport & transport option', meta: 'Required' },
        { id: 'c1-luggage', label: 'Confirm baggage & customs declaration prep', meta: 'Arrival prep' },
        { id: 'c1-touchdown', label: 'Review touch-down arrival priority pass', meta: 'Optional' }
      ]
    },
    {
      number: 2, icon: 'home', title: 'Your first home',
      summary: 'Neighborhood guides, tenancy checklist, deposit protection rules, and Right to Rent docs.',
      tasks: [
        { id: 'c2-right-to-rent', label: 'Prepare Right to Rent share code', meta: 'Tenancy' },
        { id: 'c2-neighborhood', label: 'Shortlist 3 target neighborhoods', meta: 'Research' },
        { id: 'c2-deposit', label: 'Review UK Tenancy Deposit Scheme rules', meta: 'Protection' }
      ]
    },
    {
      number: 3, icon: 'sim_card', title: 'Get connected',
      summary: 'Set up your UK mobile number, local bank account proof of address, and utility accounts.',
      tasks: [
        { id: 'c3-sim', label: 'Activate UK mobile plan or eSIM', meta: 'Connectivity' },
        { id: 'c3-bank', label: 'Open UK bank account', meta: 'Finance' },
        { id: 'c3-council', label: 'Register for Council Tax & utilities', meta: 'Home setup' }
      ]
    },
    {
      number: 4, icon: 'directions_subway', title: 'Find your rhythm',
      summary: 'Transit card setup, GP / NHS registration, National Insurance number, and local essentials.',
      tasks: [
        { id: 'c4-nhs', label: 'Register with a local NHS GP surgery', meta: 'Healthcare' },
        { id: 'c4-ni', label: 'Confirm National Insurance number application', meta: 'Work & Tax' },
        { id: 'c4-transit', label: 'Set up Railcard or contactless transit', meta: 'Commute' }
      ]
    },
    {
      number: 5, icon: 'potted_plant', title: 'Make it feel like home',
      summary: 'Community groups, local weekend spots, hobby clubs, and settling into UK life.',
      tasks: [
        { id: 'c5-community', label: 'Join local neighborhood or alumni groups', meta: 'Community' },
        { id: 'c5-explore', label: 'Save weekend day-trip & green space picks', meta: 'Lifestyle' }
      ]
    }
  ];

  let state = getLandaState();
  let expandedChapter = state.selectedTransportId ? 2 : 1;

  function renderAll() {
    state = getLandaState();
    const pct = getProgressPercent(state);
    document.getElementById('header-progress').textContent = pct + '%';

    const hero = document.getElementById('hero-card');
    if (!state.onboardingCompleted) {
      hero.innerHTML = `
        <div class="relative z-10 flex flex-col gap-3">
          <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md px-3 py-1 rounded-full w-fit text-[12px] font-medium">
            <span class="material-symbols-outlined text-[16px]">explore</span>
            <span>No relocation profile yet</span>
          </div>
          <h1 class="text-[24px] font-semibold text-white">Your UK journey awaits</h1>
          <p class="text-[14px] text-on-primary-container max-w-lg">Start in Relocate to choose your origin country, destination UK city, purpose, and household size.</p>
          <div class="pt-1">
            <a href="relocate.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-white text-primary font-semibold text-[14px] shadow-md hover:opacity-95 transition-opacity">
              <span>Start relocation setup</span>
              <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </a>
          </div>
        </div>`;
    } else {
      const days = getDaysUntil(state.arrivalDate);
      const daysLabel = days === null ? 'Date not set' : (days > 0 ? days + ' days to go' : (days === 0 ? 'Arriving today' : 'Arrived'));
      const purposeLabel = state.purpose === 'work' ? 'Career & Work' : 'Study & Uni';
      const hhLabel = state.household ? state.household.charAt(0).toUpperCase() + state.household.slice(1) : '';
      const fmCount = state.household === 'family' && Array.isArray(state.familyMembers) && state.familyMembers.length > 0
        ? ' (' + state.familyMembers.length + (state.familyMembers.length === 1 ? ' member' : ' members') + ')'
        : '';
      hero.innerHTML = `
        <div class="relative z-10 flex flex-col gap-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2">
              <span class="bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[12px] font-medium">${purposeLabel}</span>
              <span class="text-on-primary-container text-[13px]">· Household: ${hhLabel}${fmCount}</span>
            </div>
            <div class="inline-flex items-center gap-1.5 bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-[12px] font-semibold">
              <span class="material-symbols-outlined text-[15px]">schedule</span>
              <span>${daysLabel}</span>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-3 text-[22px] font-semibold text-white">
            <span>${state.originCountry}</span>
            <span class="material-symbols-outlined text-[20px] text-on-primary-container">flight_takeoff</span>
            <span>${state.destinationCity}</span>
          </div>
          ${(state.departureAirport || state.arrivalAirport || state.estimatedDirectFlightGbp !== null) ? `
            <div class="flex flex-wrap items-center gap-2 text-[12px] text-on-primary-container">
              ${(state.departureAirport || state.arrivalAirport) ? '<span class="bg-white/15 px-3 py-1 rounded-full font-medium">' + (state.departureAirport || 'Origin') + ' → ' + (state.arrivalAirport || 'UK') + '</span>' : ''}
              ${state.estimatedDirectFlightGbp !== null && state.estimatedDirectFlightGbp !== undefined ? '<span class="bg-white/15 px-3 py-1 rounded-full font-semibold tabular-nums">Skyscanner Est. £' + state.estimatedDirectFlightGbp + ' direct</span>' : ''}
            </div>
          ` : ''}
          <div class="space-y-1.5 pt-1">
            <div class="flex justify-between text-[12px] text-on-primary-container font-medium">
              <span>Relocation Progress</span>
              <span class="tabular-nums">${pct}% Completed</span>
            </div>
            <div class="w-full bg-black/20 rounded-full h-2.5 overflow-hidden">
              <div class="bg-gradient-to-r from-secondary-fixed-dim to-tertiary-fixed h-full rounded-full transition-all duration-500" style="width:${pct}%"></div>
            </div>
          </div>
        </div>`;
    }

    const list = document.getElementById('chapters-list');
    const ch1Done = !!state.selectedTransportId;
    list.innerHTML = CHAPTERS.map(ch => {
      const unlocked = ch.number === 1 || (ch.number === 2 && ch1Done) || (ch.number > 2 && state.completedTasks['c2-right-to-rent']);
      const isOpen = expandedChapter === ch.number;
      const statusText = unlocked ? (ch.number === 1 && !ch1Done ? 'ACTIVE' : 'UNLOCKED') : 'LOCKED';
      return `
        <div class="rounded-[24px] bg-surface-container-low shadow-sm overflow-hidden transition-all">
          <button type="button" onclick="toggleChapter(${ch.number})" class="w-full p-5 flex items-center justify-between text-left">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 rounded-2xl ${unlocked ? 'bg-primary-container text-on-primary-container shadow-md' : 'bg-surface-container text-on-surface-variant'} flex items-center justify-center shrink-0">
                <span class="material-symbols-outlined" ${unlocked ? 'style="font-variation-settings:\'FILL\' 1;"' : ''}>${ch.icon}</span>
              </div>
              <div>
                <div class="flex items-center gap-2 mb-0.5">
                  <span class="text-[12px] font-semibold ${unlocked ? 'text-primary' : 'text-on-surface-variant'}">Chapter ${ch.number}</span>
                  <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider ${unlocked ? 'bg-secondary-fixed text-on-secondary-fixed' : 'bg-surface-container text-on-surface-variant'}">${statusText}</span>
                </div>
                <h3 class="text-[17px] font-semibold text-on-surface">${ch.title}</h3>
              </div>
            </div>
            <div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant transition-transform ${isOpen ? 'rotate-180' : ''}">
              <span class="material-symbols-outlined">expand_more</span>
            </div>
          </button>
          <div class="${isOpen ? '' : 'hidden'} px-5 pb-5 space-y-3">
            <p class="text-[13px] text-on-surface-variant">${ch.summary}</p>
            <div class="p-4 rounded-2xl bg-surface-container-lowest shadow-sm space-y-3">
              ${ch.tasks.map(t => {
                const checked = !!(state.completedTasks && state.completedTasks[t.id]);
                return `
                  <button type="button" onclick="toggleTask('${t.id}')" class="w-full flex items-center justify-between gap-3 text-left py-1">
                    <div class="flex items-center gap-2.5">
                      <span class="material-symbols-outlined text-[20px] ${checked ? 'text-primary' : 'text-outline'}" ${checked ? 'style="font-variation-settings:\'FILL\' 1;"' : ''}>${checked ? 'check_circle' : 'radio_button_unchecked'}</span>
                      <span class="text-[14px] font-medium ${checked ? 'line-through opacity-60 text-on-surface' : 'text-on-surface'}">${t.label}</span>
                    </div>
                    <span class="text-[12px] font-medium ${checked ? 'text-primary' : 'text-on-surface-variant'} shrink-0">${checked ? 'Done' : t.meta}</span>
                  </button>`;
              }).join('')}
            </div>
            ${ch.number === 1 ? `
              <div class="flex flex-col sm:flex-row gap-2.5">
                <button type="button" onclick="confirmChapter1()" class="flex-1 py-3.5 px-5 rounded-full bg-primary text-on-primary font-semibold text-[14px] shadow-lg shadow-primary/20 hover:opacity-95 transition-opacity flex items-center justify-center gap-2">
                  <span>${state.selectedTransportId ? 'View Confirmed Transport' : 'Continue Chapter Tasks'}</span>
                  <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
                <a href="transport-setup.html" class="py-3.5 px-5 rounded-full bg-surface-container text-on-surface font-semibold text-[13px] hover:bg-surface-container-high transition-colors flex items-center justify-center">Edit Flight Info</a>
              </div>
            ` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function toggleChapter(num) {
    expandedChapter = expandedChapter === num ? 0 : num;
    renderAll();
  }

  function toggleTask(taskId) {
    state.completedTasks[taskId] = !state.completedTasks[taskId];
    saveLandaState(state);
    renderAll();
  }

  function confirmChapter1() {
    if (state.selectedTransportId) {
      window.location.href = 'transport-confirmed.html';
      return;
    }
    if (!state.departureAirport || !state.arrivalAirport || !state.arrivalDate) {
      window.location.href = 'transport-setup.html';
      return;
    }
    state.selectedTransportId = 'shortest';
    state.transportConfirmedAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    state.completedTasks['c1-flight'] = true;
    state.completedTasks['c1-luggage'] = true;
    saveLandaState(state);
    window.location.href = 'transport-confirmed.html';
  }

  renderAll();
</script>
</body>
</html>
