<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Transport Options — Landa UK Relocation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "inverse-surface": "#202d5d",
            "on-primary-container": "#ede0ff",
            "tertiary-container": "#00708a",
            "secondary-fixed-dim": "#ffb1c7",
            "tertiary-fixed": "#b7eaff",
            "on-surface": "#071747",
            "surface-bright": "#faf8ff",
            "surface-container-low": "#f3f2ff",
            "on-tertiary-fixed-variant": "#004e61",
            "surface-variant": "#dce1ff",
            "outline": "#7b7487",
            "error-container": "#ffdad6",
            "surface-dim": "#d1d8ff",
            "secondary-fixed": "#ffd9e2",
            "on-secondary": "#ffffff",
            "tertiary-fixed-dim": "#6cd3f7",
            "background": "#faf8ff",
            "error": "#ba1a1a",
            "on-tertiary-container": "#c0edff",
            "secondary": "#b5005d",
            "on-tertiary": "#ffffff",
            "surface-container-highest": "#dce1ff",
            "surface-container": "#ebedff",
            "on-primary-fixed-variant": "#5a00c6",
            "on-primary": "#ffffff",
            "inverse-on-surface": "#eff0ff",
            "primary": "#630ed4",
            "surface": "#faf8ff",
            "surface-container-high": "#e4e7ff",
            "on-secondary-fixed-variant": "#8e0048",
            "primary-fixed": "#eaddff",
            "surface-container-lowest": "#ffffff",
            "on-error-container": "#93000a",
            "primary-container": "#7c3aed",
            "outline-variant": "#ccc3d8",
            "on-secondary-fixed": "#3f001c",
            "inverse-primary": "#d2bbff",
            "on-secondary-container": "#fffbff",
            "on-surface-variant": "#4a4455",
            "primary-fixed-dim": "#d2bbff",
            "on-tertiary-fixed": "#001f28",
            "on-primary-fixed": "#25005a",
            "on-error": "#ffffff",
            "tertiary": "#00566b",
            "surface-tint": "#732ee4",
            "secondary-container": "#da2676",
            "on-background": "#071747"
          },
          borderRadius: {
            DEFAULT: "1rem",
            lg: "2rem",
            xl: "3rem",
            full: "9999px"
          },
          spacing: {
            "space-xs": "0.375rem",
            "space-sm": "0.75rem",
            "space-md": "1.25rem",
            "space-lg": "2rem",
            "space-xl": "3rem",
            "margin": "1.5rem",
            "gutter": "1.5rem"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body {
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        background-color: #faf8ff;
        color: #071747;
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen">
<header class="fixed top-0 inset-x-0 z-40 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
  <div class="max-w-3xl mx-auto h-16 px-4 flex items-center gap-2">
    <a href="transport-setup.html" class="w-11 h-11 flex items-center justify-center text-on-surface rounded-full hover:bg-surface-variant/50 transition-colors" aria-label="Go back">
      <span class="material-symbols-outlined">arrow_back_ios_new</span>
    </a>
    <h1 class="text-[18px] font-semibold text-on-surface">Transport Options</h1>
  </div>
</header>
<main class="flex-grow w-full max-w-3xl mx-auto px-6 pt-24 pb-16 flex flex-col gap-5">
  <div id="route-summary" class="text-[13px] text-on-surface-variant px-1"></div>

  <div class="flex items-center gap-2.5 overflow-x-auto pb-1">
    <button type="button" id="flt-all" onclick="setFilter('all')" class="px-4 py-2 rounded-full text-[13px] font-medium whitespace-nowrap transition-colors bg-primary text-on-primary">All Options (3)</button>
    <button type="button" id="flt-low-carbon" onclick="setFilter('low-carbon')" class="px-4 py-2 rounded-full text-[13px] font-medium whitespace-nowrap transition-colors bg-surface-container text-on-surface hover:bg-surface-container-high">Low Carbon</button>
    <button type="button" id="flt-express" onclick="setFilter('express')" class="px-4 py-2 rounded-full text-[13px] font-medium whitespace-nowrap transition-colors bg-surface-container text-on-surface hover:bg-surface-container-high">Express Only</button>
  </div>

  <div id="options-container" class="flex flex-col gap-4"></div>

  <div class="bg-surface-container-high/60 rounded-[20px] p-4 flex items-center gap-4">
    <div class="w-10 h-10 rounded-full bg-tertiary-container text-on-tertiary flex items-center justify-center shrink-0">
      <span class="material-symbols-outlined">verified_user</span>
    </div>
    <div>
      <h4 class="text-[14px] font-semibold text-on-surface">Landa Price Protection</h4>
      <p class="text-[12px] text-outline">Indicative fares are locked in for 30 minutes across all shortlisted itineraries.</p>
    </div>
  </div>
</main>
<script>

  const LANDA_STORAGE_KEY = 'landa_uk_relocation_v1';
  const EMPTY_STATE = {
    firstName: '',
    originCountry: '',
    destinationCity: '',
    purpose: null,
    household: null,
    familyMembers: [],
    onboardingCompleted: false,
    arrivalAirport: '',
    arrivalDate: '',
    heavyLuggage: false,
    travelingWithPets: false,
    petPassportReady: false,
    selectedTransportId: null,
    transportConfirmedAt: null,
    completedTasks: {},
    completedPriorityItems: {}
  };

  function getLandaState() {
    try {
      const raw = localStorage.getItem(LANDA_STORAGE_KEY);
      if (!raw) return structuredClone(EMPTY_STATE);
      return { ...structuredClone(EMPTY_STATE), ...JSON.parse(raw) };
    } catch {
      return structuredClone(EMPTY_STATE);
    }
  }

  function saveLandaState(next) {
    localStorage.setItem(LANDA_STORAGE_KEY, JSON.stringify(next));
  }

  function resetLandaState() {
    localStorage.removeItem(LANDA_STORAGE_KEY);
  }

  const ALL_TASK_IDS = [
    'c1-flight','c1-luggage','c1-touchdown',
    'c2-right-to-rent','c2-neighborhood','c2-deposit',
    'c3-sim','c3-bank','c3-council',
    'c4-nhs','c4-ni','c4-transit',
    'c5-community','c5-explore'
  ];

  function getProgressPercent(state) {
    const total = ALL_TASK_IDS.length + 1;
    let done = state.onboardingCompleted ? 1 : 0;
    ALL_TASK_IDS.forEach(id => { if (state.completedTasks && state.completedTasks[id]) done++; });
    return Math.round((done / total) * 100);
  }

  function getDaysUntil(dateStr) {
    if (!dateStr) return null;
    const t = new Date(dateStr + 'T00:00:00');
    if (isNaN(t.getTime())) return null;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.ceil((t.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
  }

  const OPTIONS = [
    { id: 'best-value', badge: 'Best Value', badgeClass: 'bg-tertiary-fixed text-on-tertiary-fixed-variant', icon: 'train', title: 'Direct Flight + Express Train', sub: 'Balanced fare with seamless rail connection', duration: '7h 45m', transfers: '1 Stop', carbon: '142kg', lowCarbon: true, express: false, price: '£650' },
    { id: 'shortest', badge: 'Shortest Time', badgeClass: 'bg-secondary-fixed text-on-secondary-fixed-variant', icon: 'flight_takeoff', title: 'Fastest Direct Flight', sub: 'Non-stop full-service carrier', duration: '5h 20m', transfers: 'Direct', carbon: '210kg', lowCarbon: false, express: true, price: '£890' },
    { id: 'flexible', badge: 'Flexible Dates', badgeClass: 'bg-primary-fixed text-on-primary-fixed-variant', icon: 'calendar_month', title: 'Flexible Itinerary', sub: 'Free date changes up to 24h before travel', duration: '6h 15m', transfers: '1 Stop', carbon: '165kg', lowCarbon: true, express: true, price: '£740' }
  ];

  let activeFilter = 'all';

  function setFilter(f) {
    activeFilter = f;
    ['all', 'low-carbon', 'express'].forEach(key => {
      const btn = document.getElementById('flt-' + key);
      btn.className = key === f
        ? 'px-4 py-2 rounded-full text-[13px] font-medium whitespace-nowrap transition-colors bg-primary text-on-primary'
        : 'px-4 py-2 rounded-full text-[13px] font-medium whitespace-nowrap transition-colors bg-surface-container text-on-surface hover:bg-surface-container-high';
    });
    renderOptions();
  }

  function renderOptions() {
    const state = getLandaState();
    const summaryEl = document.getElementById('route-summary');
    if (state.originCountry && state.arrivalAirport) {
      summaryEl.textContent = state.originCountry + ' → ' + state.arrivalAirport + (state.arrivalDate ? ' · ' + state.arrivalDate : '');
    } else {
      summaryEl.innerHTML = 'No arrival route configured yet. <a href="transport-setup.html" class="text-primary font-semibold underline">Set airport &amp; date</a>';
    }

    const filtered = OPTIONS.filter(o => {
      if (activeFilter === 'low-carbon') return o.lowCarbon;
      if (activeFilter === 'express') return o.express;
      return true;
    });

    document.getElementById('options-container').innerHTML = filtered.map(o => `
      <div class="bg-surface-container-lowest rounded-[24px] p-5 shadow-[0_12px_32px_rgba(115,46,228,0.06)] flex flex-col gap-4">
        <div class="flex items-start justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-primary-fixed text-on-primary-fixed flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined">${o.icon}</span>
            </div>
            <div>
              <h3 class="text-[17px] font-semibold text-on-surface">${o.title}</h3>
              <p class="text-[12px] text-outline">${o.sub}</p>
            </div>
          </div>
          <span class="px-3 py-1 rounded-full text-[11px] font-semibold shrink-0 ${o.badgeClass}">${o.badge}</span>
        </div>

        <div class="grid grid-cols-3 gap-2 py-3 px-4 bg-surface-container-low rounded-2xl tabular-nums">
          <div>
            <span class="text-[11px] text-outline block">Duration</span>
            <span class="text-[14px] font-semibold text-on-surface">${o.duration}</span>
          </div>
          <div>
            <span class="text-[11px] text-outline block">Transfers</span>
            <span class="text-[14px] font-semibold text-on-surface">${o.transfers}</span>
          </div>
          <div>
            <span class="text-[11px] text-outline block">Carbon</span>
            <span class="text-[14px] font-semibold text-tertiary-container">${o.carbon}</span>
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <div>
            <span class="text-[12px] text-outline block">Total Price</span>
            <span class="text-[22px] font-bold text-primary tabular-nums">${o.price}</span>
          </div>
          <button type="button" onclick="chooseOption('${o.id}')" class="bg-gradient-to-r from-primary-container to-secondary-container text-on-primary px-5 py-3 rounded-full text-[14px] font-semibold shadow-md hover:opacity-95 transition-opacity flex items-center gap-2">
            <span>Select and Save</span>
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
          </button>
        </div>
      </div>
    `).join('');
  }

  function chooseOption(id) {
    const state = getLandaState();
    state.selectedTransportId = id;
    state.transportConfirmedAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    state.completedTasks['c1-flight'] = true;
    state.completedTasks['c1-luggage'] = true;
    saveLandaState(state);
    window.location.href = 'transport-confirmed.html';
  }

  renderOptions();
</script>
</body>
</html>
