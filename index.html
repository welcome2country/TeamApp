<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team App Placeholder</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    h1 {
      color: white;
      font-size: 5rem;
      text-align: center;
      animation: sparkle 1.5s infinite alternate;
    }

    @keyframes sparkle {
      0% {
        text-shadow:
          0 0 5px #fff,
          0 0 10px #60a5fa;
        transform: scale(1);
      }

      100% {
        text-shadow:
          0 0 10px #fff,
          0 0 25px #a78bfa,
          0 0 45px #60a5fa;
        transform: scale(1.03);
      }
    }
  </style>
</head>

<body>
  <h1>✨ Placeholder for Team App ✨</h1>
</body>
</html>
