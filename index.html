  function getLandaState() {
    try {
      const raw = localStorage.getItem(LANDA_STORAGE_KEY);
      if (!raw) return structuredClone(EMPTY_STATE);
      return { ...structuredClone(EMPTY_STATE), ...JSON.parse(raw) };
    } catch {
      return structuredClone(EMPTY_STATE);
    }
  }

  function saveLandaState(next) {
    localStorage.setItem(LANDA_STORAGE_KEY, JSON.stringify(next));
  }

  function resetLandaState() {
    localStorage.removeItem(LANDA_STORAGE_KEY);
  }

  const ALL_TASK_IDS = [
    'c1-flight','c1-luggage','c1-touchdown',
    'c2-right-to-rent','c2-neighborhood','c2-deposit','c2-council-tax',
    'c3-sim','c3-bank','c3-council',
    'c4-nhs','c4-ni','c4-transit',
    'c5-community','c5-explore'
  ];

  function getProgressPercent(state) {
    const total = ALL_TASK_IDS.length + 1;
    let done = state.onboardingCompleted ? 1 : 0;
    ALL_TASK_IDS.forEach(id => { if (state.completedTasks && state.completedTasks[id]) done++; });
    return Math.round((done / total) * 100);
  }

  function getDaysUntil(dateStr) {
    if (!dateStr) return null;
    const t = new Date(dateStr + 'T00:00:00');
    if (isNaN(t.getTime())) return null;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.ceil((t.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
  }

  function getArrivalAirportIata(arrivalAirport) {
    if (!arrivalAirport) return 'LHR';
    const lower = String(arrivalAirport).toLowerCase();
    if (lower === 'heathrow') return 'LHR';
    if (lower === 'gatwick') return 'LGW';
    if (lower === 'manchester') return 'MAN';
    if (/^[a-z]{3}$/.test(lower)) return lower.toUpperCase();
    return 'LHR';
  }

  function getTravelerCount(state) {
    if (state.household === 'couple') return 2;
    if (state.household === 'family') return Math.max(1, 1 + ((state.familyMembers && state.familyMembers.length) || 0));
    return 1;
  }

  function buildSkyscannerSearchUrl(dep, arr, dateStr) {
    const d = (dep || '').trim().toLowerCase();
    const a = getArrivalAirportIata(arr || 'Heathrow').toLowerCase();
    const yymmdd = dateStr ? dateStr.replace(/-/g, '').slice(2, 8) : '';
    if (/^[a-z]{3}$/.test(d) && /^[a-z]{3}$/.test(a) && /^\d{6}$/.test(yymmdd)) {
      return 'https://www.skyscanner.net/transport/flights/' + d + '/' + a + '/' + yymmdd + '/?adults=1&preferdirects=true';
    }
    return 'https://www.skyscanner.net/flights';
  }

  const BASE_FARES = {
    'United States': { baseGbp: 520, carrier: 'British Airways / Virgin Atlantic' },
    'Canada': { baseGbp: 495, carrier: 'Air Canada / British Airways' },
    'Australia': { baseGbp: 980, carrier: 'Qantas Direct' },
    'Germany': { baseGbp: 145, carrier: 'Lufthansa / British Airways' },
    'France': { baseGbp: 128, carrier: 'Air France / British Airways' },
    'Singapore': { baseGbp: 790, carrier: 'Singapore Airlines Direct' },
    'India': { baseGbp: 560, carrier: 'British Airways / Air India' },
    'Brazil': { baseGbp: 695, carrier: 'British Airways / LATAM' },
    'Ireland': { baseGbp: 78, carrier: 'Aer Lingus / British Airways' },
    'Japan': { baseGbp: 845, carrier: 'JAL / British Airways' }
  };

  const AIRPORT_DELTAS = {
    SFO:115, LAX:110, ORD:45, ATL:55, IAD:35, BOS:-15, JFK:0, EWR:-10,
    YVR:95, YYC:65, YUL:20, YYZ:0, PER:70, BNE:40, MEL:25, SYD:0,
    MUC:18, BER:12, DUS:-8, FRA:0, LYS:22, NCE:28, ORY:-6, CDG:0,
    MAA:42, BLR:35, BOM:12, DEL:0, GIG:25, GRU:0, ORK:14, SNN:18, DUB:0,
    KIX:45, NRT:15, HND:0, SIN:0
  };

  function computeIndicativeDirectFlight(originCountry, depIata, arrName, dateStr, travelers) {
    const info = BASE_FARES[originCountry] || { baseGbp: 460, carrier: 'Skyscanner Direct Carrier' };
    let fare = info.baseGbp + (AIRPORT_DELTAS[depIata] || 0);
    const arrCode = getArrivalAirportIata(arrName);
    if (arrCode === 'LGW') fare -= 24;
    if (arrCode === 'MAN') fare += 18;
    if (dateStr) {
      const parsed = new Date(dateStr + 'T00:00:00');
      if (!isNaN(parsed.getTime())) {
        const m = parsed.getMonth();
        const mult = [0.9, 0.88, 0.94, 1.04, 1.08, 1.24, 1.34, 1.32, 1.05, 0.96, 0.91, 1.28];
        fare *= (mult[m] || 1);
        const dow = parsed.getDay();
        if (dow === 5 || dow === 6 || dow === 0) fare *= 1.09;
        else if (dow === 2 || dow === 3) fare *= 0.94;
        const daysOut = getDaysUntil(dateStr);
        const dOut = daysOut === null ? 30 : daysOut;
        if (dOut <= 7) fare *= 1.38;
        else if (dOut <= 21) fare *= 1.18;
        else if (dOut >= 90) fare *= 0.92;
        const variance = ((parsed.getDate() * 13 + m * 7) % 23) - 11;
        fare += variance;
      }
    }
    const priceGbp = Math.max(45, Math.round(fare));
    const safeT = Math.max(1, travelers || 1);
    return { priceGbp, totalPriceGbp: priceGbp * safeT, carrierName: info.carrier, source: 'indicative_estimate' };
  }

  async function fetchSkyscannerEstimate(stateObj) {
    const travelers = getTravelerCount(stateObj);
    const arrCode = getArrivalAirportIata(stateObj.arrivalAirport || 'Heathrow');
    try {
      const res = await fetch('/api/skyscanner/indicative', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          originCountry: stateObj.originCountry || '',
          departureIata: stateObj.departureAirport || '',
          arrivalIata: arrCode,
          arrivalDate: stateObj.arrivalDate,
          travelers
        })
      });
      if (res.ok) {
        const data = await res.json();
        if (typeof data.priceGbp === 'number') {
          return {
            priceGbp: data.priceGbp,
            totalPriceGbp: data.priceGbp * travelers,
            carrierName: data.carrierName || 'Direct Carrier',
            source: data.source || 'indicative_estimate'
          };
        }
      }
    } catch {}
    return computeIndicativeDirectFlight(stateObj.originCountry || '', stateObj.departureAirport || '', arrCode, stateObj.arrivalDate, travelers);
  }

  function getBedroomProfileForPeople(peopleCount) {
    if (peopleCount <= 1) return { label: '1-bedroom flat', sizeFactor: 1.0 };
    if (peopleCount === 2) return { label: '1–2 bedroom flat', sizeFactor: 1.22 };
    if (peopleCount === 3) return { label: '2–3 bedroom home', sizeFactor: 1.48 };
    if (peopleCount === 4) return { label: '3-bedroom home', sizeFactor: 1.72 };
    return {
      label: Math.min(5, Math.ceil(peopleCount / 2) + 1) + '-bedroom family home',
      sizeFactor: 1.72 + (peopleCount - 4) * 0.22
    };
  }

  function computeOnsRentEstimate(city, neighborhood, peopleCount, onsIndex, onsYoYPercent, onsPeriod, source) {
    const cityMeta = ONS_REGION_BY_CITY[city] || { geoCode: 'E92000001', regionName: 'England', baseOneBedGbp: 1100 };
    const areas = NEIGHBORHOODS_BY_CITY[city] || [];
    const areaMeta = areas.find(a => a.name === neighborhood);
    const areaMult = areaMeta ? areaMeta.multiplier : 1.0;
    const safePeople = Math.max(1, peopleCount || 1);
    const bp = getBedroomProfileForPeople(safePeople);
    const idx = onsIndex || 121.2;
    const yoy = (onsYoYPercent !== undefined && onsYoYPercent !== null) ? onsYoYPercent : 6.9;
    const indexFactor = idx > 0 ? idx / 120 : 1;
    const estRent = Math.round((cityMeta.baseOneBedGbp * areaMult * bp.sizeFactor * indexFactor) / 10) * 10;
    return {
      estimatedMonthlyRentGbp: estRent,
      bedroomRecommendation: bp.label,
      peopleCount: safePeople,
      onsRegionName: cityMeta.regionName,
      onsGeographyCode: cityMeta.geoCode,
      onsIndex: idx,
      onsYoYPercent: yoy,
      onsPeriod: onsPeriod || 'Latest',
      source: source || 'ons_indicative'
    };
  }

  const ONS_MON = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
  function parseOnsMonth(lbl) {
    const parts = (lbl || '').split('-');
    const m = ONS_MON[parts[0]];
    const y = Number(parts[1]);
    if (m === undefined || isNaN(y)) return -1;
    return (y >= 70 ? 1900 + y : 2000 + y) * 12 + m;
  }

  async function fetchOnsRentEstimate(city, neighborhood, peopleCount) {
    const safePeople = Math.max(1, peopleCount || 1);
    try {
      const res = await fetch('/api/ons/rent-estimate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ city: city || '', neighborhood: neighborhood || '', peopleCount: safePeople })
      });
      if (res.ok) {
        const d = await res.json();
        if (typeof d.estimatedMonthlyRentGbp === 'number') return d;
      }
    } catch {}
    try {
      const cityMeta = ONS_REGION_BY_CITY[city] || { geoCode: 'E92000001' };
      const baseVer = 'https://api.beta.ons.gov.uk/v1/datasets/index-private-housing-rental-prices/editions/time-series/versions/41';
      const [idxR, yoyR] = await Promise.all([
        fetch(baseVer + '/observations?geography=' + encodeURIComponent(cityMeta.geoCode) + '&indexandyearchange=index&time=*'),
        fetch(baseVer + '/observations?geography=' + encodeURIComponent(cityMeta.geoCode) + '&indexandyearchange=year-on-year-change&time=*')
      ]);
      if (idxR.ok) {
        const idxJ = await idxR.json();
        const yoyJ = yoyR.ok ? await yoyR.json() : { observations: [] };
        let bestS = -1, period = 'Latest', idxVal = 121.2;
        (idxJ.observations || []).forEach(o => {
          const l = o && o.dimensions && o.dimensions.Time ? o.dimensions.Time.label : '';
          const v = Number(o.observation);
          const sc = parseOnsMonth(l);
          if (sc > bestS && !isNaN(v) && v > 0) { bestS = sc; period = l; idxVal = v; }
        });
        let bestY = -1, yoyVal = 6.9;
        (yoyJ.observations || []).forEach(o => {
          const l = o && o.dimensions && o.dimensions.Time ? o.dimensions.Time.label : '';
          const v = Number(o.observation);
          const sc = parseOnsMonth(l);
          if (sc > bestY && !isNaN(v)) { bestY = sc; yoyVal = v; }
        });
        return computeOnsRentEstimate(city, neighborhood, safePeople, idxVal, yoyVal, period, 'ons_live_api');
      }
    } catch {}
    return computeOnsRentEstimate(city, neighborhood, safePeople);
  }

  function hasChildInFamily(stateObj) {
    return stateObj.household === 'family' && Array.isArray(stateObj.familyMembers) && stateObj.familyMembers.some(m => String(m.relationship || '').trim().toLowerCase() === 'child');
  }

  function getChildAgesInFamily(stateObj) {
    if (!hasChildInFamily(stateObj)) return [];
    return stateObj.familyMembers
      .filter(m => String(m.relationship || '').trim().toLowerCase() === 'child')
      .map(m => Number(m.age))
      .filter(a => !isNaN(a) && a >= 0 && a <= 25);
  }

  async function fetchDfeSchools(city, neighborhood, childAges) {
    try {
      const res = await fetch('/api/dfe/schools', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ city: city || '', neighborhood: neighborhood || '', childAges: childAges || [] })
      });
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data.schools)) return data;
      }
    } catch {}
    const cfg = (NEIGHBORHOOD_SCHOOL_META[city] || {})[neighborhood];
    return {
      schools: cfg ? cfg.fallbackSchools.slice(0, 5) : [],
      source: cfg && cfg.laCodes && cfg.laCodes.length === 0 ? 'scottish_council_directory' : 'dfe_ees_indicative',
      councilName: cfg ? cfg.councilName : (city || 'UK'),
      publicationTitle: 'Schools, pupils and their characteristics (2025/26)',
      apiUrl: 'https://www.api.gov.uk/dfe/explore-education-statistics-api/#explore-education-statistics-api'
    };
  }

  function renderSchoolsCardHtml(data, areaName, childAges) {
    const schools = Array.isArray(data.schools) ? data.schools : [];
    const badge = data.source === 'dfe_ees_live_api'

  function submitRelocate(e) {
    e.preventDefault();

    const missing = [];
    if (!s.originCountry) missing.push('origin country');
    if (!s.destinationCity) missing.push('destination UK city');
    if (!s.purpose) missing.push('primary purpose');
    if (!s.household) missing.push('who is moving');
    if (missing.length) {
      formError = 'Please select your ' + missing.join(', ') + ' before building your journey.';
      renderApp();
      return;
    }
    if (s.household === 'family') {
      const members = Array.isArray(s.familyMembers) ? s.familyMembers : [];
      if (members.length === 0) {
        formError = 'Please add at least one family member with their type and age.';
        renderApp();
        return;
      }
      const bad = members.some(m => {
        const a = Number(m.age);
        return !m.relationship || String(m.age).trim() === '' || isNaN(a) || a < 0 || a > 120;
      });
      if (bad) {
        formError = 'Please enter a relationship type and valid age (0–120) for each family member.';
        renderApp();
        return;

    saveLandaState({ ...s, onboardingCompleted: true });

          <div id="spa-ons-card" class="hidden bg-surface-container-lowest rounded-[24px] p-5 shadow-[0_8px_24px_rgba(99,14,212,0.08)] flex flex-col gap-3" aria-live="polite"></div>
          <div id="spa-schools-card" class="hidden bg-surface-container-lowest rounded-[24px] p-5 shadow-[0_8px_24px_rgba(99,14,212,0.08)] flex flex-col gap-3.5" aria-live="polite"></div>
          ${formError ? '<p class="text-[13px] font-medium text-error bg-error-container px-4 py-3 rounded-2xl">' + formError + '</p>' : ''}
          <button type="submit" class="w-full py-4 px-6 rounded-full bg-gradient-to-r from-primary-container to-secondary-container text-on-primary font-semibold text-[15px] flex items-center justify-center gap-2"><span>Next: Show Housing Checklist</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button>
        </form>`;
      if (s.selectedNeighborhood) {
        refreshSpaOnsEstimate();
        refreshSpaSchoolsCard();
      }
      return;
    }

    if (currentScreen === 'guides') {
      root.innerHTML = `
        <div class="flex flex-col gap-5">
          <div><h1 class="text-[26px] font-semibold">UK Relocation Guides</h1><p class="text-[14px] text-on-surface-variant mt-1">${s.destinationCity ? 'Tailored for your move to ' + s.destinationCity + '.' : 'Practical checklists for housing, banking, NHS healthcare, and transit.'}</p></div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${GUIDES.map(g => `<article class="bg-surface-container-low rounded-[24px] p-5 flex flex-col gap-3">
              <div class="text-[12px] text-on-surface-variant font-medium">${g.category} · ${g.read}</div>
              <h2 class="text-[17px] font-semibold">${g.title}</h2>
              <p class="text-[13px] text-on-surface-variant">${g.summary}</p>
              <ul class="space-y-1.5 pt-1 text-[13px]">${g.points.map(p => '<li class="flex items-start gap-2"><span class="text-primary font-bold">·</span><span>' + p + '</span></li>').join('')}</ul>
            </article>`).join('')}
          </div>
        </div>`;
      return;
    }

    if (currentScreen === 'profile') {
      root.innerHTML = `
        <div class="max-w-3xl mx-auto bg-surface-container-low rounded-[24px] p-6 flex flex-col gap-4">
          <h1 class="text-[22px] font-semibold">Relocation Profile</h1>
          ${!s.onboardingCompleted ? '<p class="text-[14px] text-on-surface-variant">No relocation preferences saved yet. Start in Relocate to configure your move.</p>' : `
            <div class="text-[14px] text-on-surface-variant space-y-1.5">
              <p><strong>Route:</strong> ${s.originCountry} → ${s.destinationCity}</p>
              <p><strong>Purpose:</strong> ${s.purpose === 'work' ? 'Career & Work' : 'Study & Uni'}</p>
              <p><strong>Household:</strong> ${s.household || 'Not set'}</p>
              ${s.household === 'family' && (s.familyMembers || []).length > 0 ? '<p><strong>Family Members:</strong> ' + s.familyMembers.map(m => (m.relationship || 'Person') + ' (Age ' + (m.age || '—') + ')').join(', ') + '</p>' : ''}
              <p><strong>Airports:</strong> ${s.departureAirport || 'Departure not set'} → ${s.arrivalAirport || 'Arrival not set'}</p>
              <p><strong>Target Date:</strong> ${s.arrivalDate || 'Not set'}</p>
              ${s.estimatedDirectFlightGbp !== null && s.estimatedDirectFlightGbp !== undefined ? '<p><strong>Skyscanner Direct Estimate:</strong> £' + s.estimatedDirectFlightGbp + ' per traveler' + (s.estimatedFlightCarrier ? ' · ' + s.estimatedFlightCarrier : '') + '</p>' : ''}
              ${s.selectedNeighborhood ? '<p><strong>Target Neighbourhood &amp; ONS Rent Estimate:</strong> ' + s.selectedNeighborhood + (s.estimatedMonthlyRentGbp !== null && s.estimatedMonthlyRentGbp !== undefined ? ' · £' + Number(s.estimatedMonthlyRentGbp).toLocaleString() + '/month (' + (s.estimatedRentBedrooms || 'Private Rent') + ')' : '') + '</p>' : ''}
              <p><strong>Progress:</strong> ${getProgressPercent(s)}%</p>
            </div>
          `}
          <div class="flex flex-wrap gap-3 pt-2">
            <button type="button" onclick="go('relocate')" class="px-5 py-2.5 rounded-full bg-primary text-on-primary text-[13px] font-semibold">Edit Preferences</button>
            <button type="button" onclick="resetLandaState(); renderApp();" class="px-5 py-2.5 rounded-full bg-error-container text-on-error-container text-[13px] font-semibold">Reset All Data</button>
          </div>
        </div>`;
    }
  }

  renderApp();
</script>
</body>
</html>
