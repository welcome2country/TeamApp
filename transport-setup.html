<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Transport Setup — Landa UK Relocation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "inverse-surface": "#202d5d",
            "on-primary-container": "#ede0ff",
            "tertiary-container": "#00708a",
            "secondary-fixed-dim": "#ffb1c7",
            "tertiary-fixed": "#b7eaff",
            "on-surface": "#071747",
            "surface-bright": "#faf8ff",
            "surface-container-low": "#f3f2ff",
            "on-tertiary-fixed-variant": "#004e61",
            "surface-variant": "#dce1ff",
            "outline": "#7b7487",
            "error-container": "#ffdad6",
            "surface-dim": "#d1d8ff",
            "secondary-fixed": "#ffd9e2",
            "on-secondary": "#ffffff",
            "tertiary-fixed-dim": "#6cd3f7",
            "background": "#faf8ff",
            "error": "#ba1a1a",
            "on-tertiary-container": "#c0edff",
            "secondary": "#b5005d",
            "on-tertiary": "#ffffff",
            "surface-container-highest": "#dce1ff",
            "surface-container": "#ebedff",
            "on-primary-fixed-variant": "#5a00c6",
            "on-primary": "#ffffff",
            "inverse-on-surface": "#eff0ff",
            "primary": "#630ed4",
            "surface": "#faf8ff",
            "surface-container-high": "#e4e7ff",
            "on-secondary-fixed-variant": "#8e0048",
            "primary-fixed": "#eaddff",
            "surface-container-lowest": "#ffffff",
            "on-error-container": "#93000a",
            "primary-container": "#7c3aed",
            "outline-variant": "#ccc3d8",
            "on-secondary-fixed": "#3f001c",
            "inverse-primary": "#d2bbff",
            "on-secondary-container": "#fffbff",
            "on-surface-variant": "#4a4455",
            "primary-fixed-dim": "#d2bbff",
            "on-tertiary-fixed": "#001f28",
            "on-primary-fixed": "#25005a",
            "on-error": "#ffffff",
            "tertiary": "#00566b",
            "surface-tint": "#732ee4",
            "secondary-container": "#da2676",
            "on-background": "#071747"
          },
          borderRadius: {
            DEFAULT: "1rem",
            lg: "2rem",
            xl: "3rem",
            full: "9999px"
          },
          spacing: {
            "space-xs": "0.375rem",
            "space-sm": "0.75rem",
            "space-md": "1.25rem",
            "space-lg": "2rem",
            "space-xl": "3rem",
            "margin": "1.5rem",
            "gutter": "1.5rem"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body {
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        background-color: #faf8ff;
        color: #071747;
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen">
<header class="fixed top-0 inset-x-0 z-40 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
  <div class="max-w-3xl mx-auto h-16 px-4 flex items-center gap-2">
    <a href="journey.html" class="w-11 h-11 flex items-center justify-center text-on-surface rounded-full hover:bg-surface-variant/50 transition-colors" aria-label="Go back">
      <span class="material-symbols-outlined">arrow_back_ios_new</span>
    </a>
    <h1 class="text-[18px] font-semibold text-on-surface">Task Details</h1>
  </div>
</header>
<main class="flex-grow w-full max-w-2xl mx-auto px-6 pt-24 pb-16 flex flex-col gap-5">
  <div class="bg-surface-container-low rounded-[24px] p-5 shadow-[0_10px_30px_rgba(115,46,228,0.06)] flex items-start gap-4">
    <div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shrink-0">
      <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">flight_takeoff</span>
    </div>
    <div>
      <h2 class="text-[22px] font-semibold text-on-surface mb-1">Smooth landings ahead</h2>
      <p class="text-[14px] text-on-surface-variant">Choose your preferred UK arrival airport, target date, and baggage or pet requirements to view matching routes.</p>
    </div>
  </div>

  <form onsubmit="handleFindTransport(event)" class="flex flex-col gap-5">
    <div class="bg-surface-container-low rounded-[24px] p-5 shadow-sm">
      <label class="text-[14px] font-semibold text-on-surface mb-3 flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-[20px]">connecting_airports</span>
        <span>Destination Arrival Airport</span>
      </label>
      <div class="grid grid-cols-3 gap-2.5">
        <button type="button" id="ap-Heathrow" onclick="pickAirport('Heathrow')" class="ap-btn flex flex-col items-center justify-center p-3.5 rounded-2xl bg-surface border-2 border-transparent text-on-surface-variant hover:bg-surface-container transition-all">
          <span class="material-symbols-outlined mb-1">flight_land</span>
          <span class="text-[13px] font-semibold">Heathrow</span>
          <span class="text-[11px] text-outline mt-0.5">LHR · Main Hub</span>
        </button>
        <button type="button" id="ap-Gatwick" onclick="pickAirport('Gatwick')" class="ap-btn flex flex-col items-center justify-center p-3.5 rounded-2xl bg-surface border-2 border-transparent text-on-surface-variant hover:bg-surface-container transition-all">
          <span class="material-symbols-outlined mb-1">flight_land</span>
          <span class="text-[13px] font-semibold">Gatwick</span>
          <span class="text-[11px] text-outline mt-0.5">LGW · South</span>
        </button>
        <button type="button" id="ap-Manchester" onclick="pickAirport('Manchester')" class="ap-btn flex flex-col items-center justify-center p-3.5 rounded-2xl bg-surface border-2 border-transparent text-on-surface-variant hover:bg-surface-container transition-all">
          <span class="material-symbols-outlined mb-1">flight_land</span>
          <span class="text-[13px] font-semibold">Manchester</span>
          <span class="text-[11px] text-outline mt-0.5">MAN · North</span>
        </button>
      </div>
    </div>

    <div class="bg-surface-container-low rounded-[24px] p-5 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <label for="arrival-date" class="text-[14px] font-semibold text-on-surface flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-[20px]">event_available</span>
          <span>Target Arrival Date</span>
        </label>
        <span class="bg-tertiary-fixed text-on-tertiary-fixed-variant text-[11px] px-2.5 py-0.5 rounded-full font-semibold">Required</span>
      </div>
      <input id="arrival-date" type="date" value="" class="w-full bg-surface text-on-surface p-4 rounded-2xl text-[15px] font-medium focus:outline-none focus:ring-2 focus:ring-primary" />
      <p class="text-[12px] text-outline mt-2 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-[15px] text-tertiary-container">auto_awesome</span>
        <span>Leave buffer days before your lease or start date if possible.</span>
      </p>
    </div>

    <div class="bg-surface-container-low rounded-[24px] p-5 shadow-sm flex flex-col gap-4">
      <label class="flex items-center justify-between cursor-pointer">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-surface-variant/60 text-secondary flex items-center justify-center">
            <span class="material-symbols-outlined">luggage</span>
          </div>
          <div>
            <span class="block text-[14px] font-semibold text-on-surface">Heavy Luggage / Extra Trunks</span>
            <span class="text-[12px] text-outline">More than 3 large bags per person</span>
          </div>
        </div>
        <input id="luggage-toggle" type="checkbox" class="w-5 h-5 accent-primary cursor-pointer" />
      </label>

      <div class="h-px bg-outline-variant/40 w-full"></div>

      <label class="flex items-center justify-between cursor-pointer">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-surface-variant/60 text-secondary flex items-center justify-center">
            <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">pets</span>
          </div>
          <div>
            <span class="block text-[14px] font-semibold text-on-surface">Traveling with Pets</span>
            <span class="text-[12px] text-outline">Dogs, cats, or companion animals</span>
          </div>
        </div>
        <input id="pets-toggle" type="checkbox" onchange="togglePetsNote()" class="w-5 h-5 accent-primary cursor-pointer" />
      </label>

      <div id="pet-suboptions" class="hidden pt-1">
        <label class="bg-surface p-3.5 rounded-2xl flex items-center justify-between gap-3 cursor-pointer">
          <span class="text-[13px] text-on-surface-variant font-medium">Confirm pets meet DEFRA entry requirements</span>
          <input id="pet-defra" type="checkbox" class="w-4 h-4 accent-primary" />
        </label>
      </div>
    </div>

    <p id="setup-error" class="hidden text-[13px] font-medium text-error bg-error-container px-4 py-3 rounded-2xl"></p>

    <button type="submit" class="w-full py-4 px-6 rounded-full bg-gradient-to-r from-primary-container to-secondary-container text-on-primary font-semibold text-[15px] shadow-[0_10px_25px_rgba(124,58,237,0.3)] hover:opacity-95 transition-all flex items-center justify-center gap-2">
      <span>Find transport options</span>
      <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
    </button>
  </form>
</main>
<script>

  const LANDA_STORAGE_KEY = 'landa_uk_relocation_v1';
  const EMPTY_STATE = {
    firstName: '',
    originCountry: '',
    destinationCity: '',
    purpose: null,
    household: null,
    familyMembers: [],
    onboardingCompleted: false,
    arrivalAirport: '',
    arrivalDate: '',
    heavyLuggage: false,
    travelingWithPets: false,
    petPassportReady: false,
    selectedTransportId: null,
    transportConfirmedAt: null,
    completedTasks: {},
    completedPriorityItems: {}
  };

  function getLandaState() {
    try {
      const raw = localStorage.getItem(LANDA_STORAGE_KEY);
      if (!raw) return structuredClone(EMPTY_STATE);
      return { ...structuredClone(EMPTY_STATE), ...JSON.parse(raw) };
    } catch {
      return structuredClone(EMPTY_STATE);
    }
  }

  function saveLandaState(next) {
    localStorage.setItem(LANDA_STORAGE_KEY, JSON.stringify(next));
  }

  function resetLandaState() {
    localStorage.removeItem(LANDA_STORAGE_KEY);
  }

  const ALL_TASK_IDS = [
    'c1-flight','c1-luggage','c1-touchdown',
    'c2-right-to-rent','c2-neighborhood','c2-deposit',
    'c3-sim','c3-bank','c3-council',
    'c4-nhs','c4-ni','c4-transit',
    'c5-community','c5-explore'
  ];

  function getProgressPercent(state) {
    const total = ALL_TASK_IDS.length + 1;
    let done = state.onboardingCompleted ? 1 : 0;
    ALL_TASK_IDS.forEach(id => { if (state.completedTasks && state.completedTasks[id]) done++; });
    return Math.round((done / total) * 100);
  }

  function getDaysUntil(dateStr) {
    if (!dateStr) return null;
    const t = new Date(dateStr + 'T00:00:00');
    if (isNaN(t.getTime())) return null;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.ceil((t.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
  }

  let state = getLandaState();
  let selectedAirport = state.arrivalAirport || '';

  if (state.arrivalDate) document.getElementById('arrival-date').value = state.arrivalDate;
  document.getElementById('luggage-toggle').checked = !!state.heavyLuggage;
  document.getElementById('pets-toggle').checked = !!state.travelingWithPets;
  document.getElementById('pet-defra').checked = !!state.petPassportReady;

  function renderAirports() {
    ['Heathrow', 'Gatwick', 'Manchester'].forEach(name => {
      const btn = document.getElementById('ap-' + name);
      if (selectedAirport === name) {
        btn.className = "ap-btn flex flex-col items-center justify-center p-3.5 rounded-2xl bg-primary-fixed/40 border-2 border-primary text-primary transition-all shadow-sm";
      } else {
        btn.className = "ap-btn flex flex-col items-center justify-center p-3.5 rounded-2xl bg-surface border-2 border-transparent text-on-surface-variant hover:bg-surface-container transition-all";
      }
    });
  }

  function pickAirport(name) {
    selectedAirport = name;
    renderAirports();
  }

  function togglePetsNote() {
    const on = document.getElementById('pets-toggle').checked;
    document.getElementById('pet-suboptions').classList.toggle('hidden', !on);
  }

  renderAirports();
  togglePetsNote();

  function handleFindTransport(e) {
    e.preventDefault();
    const dateVal = document.getElementById('arrival-date').value;
    const err = document.getElementById('setup-error');
    const missing = [];
    if (!selectedAirport) missing.push('arrival airport');
    if (!dateVal) missing.push('target arrival date');

    if (missing.length > 0) {
      err.textContent = 'Please select your ' + missing.join(' and ') + ' to continue.';
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    state = {
      ...state,
      arrivalAirport: selectedAirport,
      arrivalDate: dateVal,
      heavyLuggage: document.getElementById('luggage-toggle').checked,
      travelingWithPets: document.getElementById('pets-toggle').checked,
      petPassportReady: document.getElementById('pet-defra').checked
    };
    saveLandaState(state);
    window.location.href = 'transport-options.html';
  }
</script>
</body>
</html>
