<!DOCTYPE html>

  <style>
    @layer base {
      html, body {
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        background-color: #faf8ff;
        color: #071747;
        margin: 0;

        overscroll-behavior: none;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
    .tabular-nums { font-variant-numeric: tabular-nums; }

</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen">
<header class="fixed top-0 inset-x-0 z-40 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
  <div class="max-w-3xl mx-auto h-16 px-4 flex items-center gap-2">
    <a href="journey.html" class="w-11 h-11 flex items-center justify-center text-on-surface rounded-full hover:bg-surface-variant/50 transition-colors" aria-label="Go back">
      <span class="material-symbols-outlined">arrow_back_ios_new</span>
    </a>
    <h1 class="text-[18px] font-semibold text-on-surface">Task Details</h1>
  </div>
</header>
<main class="flex-grow w-full max-w-2xl mx-auto px-6 pt-24 pb-16 flex flex-col gap-6">
  <div id="confirmed-content" class="flex flex-col gap-6"></div>
</main>
<script>

  const LANDA_STORAGE_KEY = 'landa_uk_relocation_v1';
  const EMPTY_STATE = {
    firstName: '',
    originCountry: '',
    destinationCity: '',
    purpose: null,
    household: null,
    familyMembers: [],
    onboardingCompleted: false,
    arrivalAirport: '',
    arrivalDate: '',
    heavyLuggage: false,
    travelingWithPets: false,
    petPassportReady: false,
    selectedTransportId: null,
    transportConfirmedAt: null,
    completedTasks: {},
    completedPriorityItems: {}
  };

  function getLandaState() {
    try {
      const raw = localStorage.getItem(LANDA_STORAGE_KEY);
      if (!raw) return structuredClone(EMPTY_STATE);
      return { ...structuredClone(EMPTY_STATE), ...JSON.parse(raw) };
    } catch {
      return structuredClone(EMPTY_STATE);
    }
  }

  function saveLandaState(next) {
    localStorage.setItem(LANDA_STORAGE_KEY, JSON.stringify(next));
  }

  function resetLandaState() {
    localStorage.removeItem(LANDA_STORAGE_KEY);
  }

  const ALL_TASK_IDS = [
    'c1-flight','c1-luggage','c1-touchdown',
    'c2-right-to-rent','c2-neighborhood','c2-deposit',
    'c3-sim','c3-bank','c3-council',
    'c4-nhs','c4-ni','c4-transit',
    'c5-community','c5-explore'
  ];

  function getProgressPercent(state) {
    const total = ALL_TASK_IDS.length + 1;
    let done = state.onboardingCompleted ? 1 : 0;
    ALL_TASK_IDS.forEach(id => { if (state.completedTasks && state.completedTasks[id]) done++; });
    return Math.round((done / total) * 100);
  }

  function getDaysUntil(dateStr) {
    if (!dateStr) return null;
    const t = new Date(dateStr + 'T00:00:00');
    if (isNaN(t.getTime())) return null;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.ceil((t.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
  }

  const OPTIONS_MAP = {
    'best-value': { title: 'Direct Flight + Express Train', duration: '7h 45m', price: '£650', code: '#LN-4102' },
    'shortest': { title: 'Fastest Direct Flight', duration: '5h 20m', price: '£890', code: '#LN-8492' },
    'flexible': { title: 'Flexible Itinerary', duration: '6h 15m', price: '£740', code: '#LN-6274' }
  };

  const state = getLandaState();
  const root = document.getElementById('confirmed-content');
  const chosen = state.selectedTransportId ? OPTIONS_MAP[state.selectedTransportId] : null;

  if (!chosen) {
    root.innerHTML = `
      <div class="bg-surface-container-low rounded-[24px] p-6 text-center flex flex-col items-center gap-3">
        <span class="material-symbols-outlined text-[40px] text-primary">flight_takeoff</span>
        <h2 class="text-[20px] font-semibold text-on-surface">No transport selected yet</h2>
        <p class="text-[14px] text-on-surface-variant max-w-sm">Choose your arrival airport, target date, and transport option to unlock your confirmation card.</p>
        <a href="transport-setup.html" class="mt-2 px-6 py-3 rounded-full bg-primary text-on-primary text-[14px] font-semibold">Go to Transport Setup</a>
      </div>`;
  } else {
    const routeText = (state.originCountry || 'Origin') + ' to ' + (state.destinationCity || state.arrivalAirport || 'UK');
    const airportText = state.arrivalAirport ? state.arrivalAirport + ' Arrival Hub' : 'UK Arrival Hub';
    root.innerHTML = `
      <div class="rounded-[24px] bg-gradient-to-r from-primary-container to-secondary-container p-6 text-on-primary-container shadow-xl">
        <div class="flex items-start gap-3">
          <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-white" style="font-variation-settings:'FILL' 1;">celebration</span>
          </div>
          <div>
            <span class="text-[11px] uppercase tracking-wider text-white/80 font-semibold">Milestone Unlocked</span>
            <h2 class="text-[22px] font-semibold text-white">Transport Booked!</h2>
            <p class="text-[13px] text-white/90 mt-1">Chapter 1 milestone completed. Your relocation journey is officially in motion.</p>
          </div>
        </div>
        <div class="mt-4 space-y-1.5">
          <div class="flex justify-between text-[12px] text-white font-medium">
            <span>Chapter 1 Progress</span>
            <span class="tabular-nums">100%</span>
          </div>
          <div class="w-full h-2 rounded-full bg-white/25 overflow-hidden">
            <div class="w-full h-full bg-white rounded-full"></div>
          </div>
        </div>
      </div>

      <div class="rounded-[24px] bg-surface-container-lowest p-5 shadow-md flex flex-col gap-4">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary">
              <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">flight_takeoff</span>
            </div>
            <div>
              <h3 class="text-[17px] font-semibold text-on-surface">${routeText}</h3>
              <span class="text-[12px] text-outline">${chosen.title} · ${chosen.code}</span>
            </div>
          </div>
          <span class="px-3 py-1 rounded-full bg-tertiary-fixed text-on-tertiary-fixed-variant text-[12px] font-semibold">Confirmed</span>
        </div>

        <div class="grid grid-cols-2 gap-3 bg-surface-container-low p-4 rounded-2xl">
          <div>
            <span class="text-[12px] text-outline block">Target Date</span>
            <span class="text-[16px] font-semibold text-on-surface">${state.arrivalDate || 'Scheduled'}</span>
            <span class="text-[12px] text-on-surface-variant block mt-0.5">Duration: ${chosen.duration}</span>
          </div>
          <div>
            <span class="text-[12px] text-outline block">Arrival Hub</span>
            <span class="text-[16px] font-semibold text-on-surface">${state.arrivalAirport || 'UK'}</span>
            <span class="text-[12px] text-on-surface-variant block mt-0.5">${airportText}</span>
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <div class="flex items-center gap-1.5 text-[12px] text-outline">
            <span class="material-symbols-outlined text-[16px]">schedule</span>
            <span>Locked in at ${state.transportConfirmedAt || 'just now'}</span>
          </div>
          <div class="text-right">
            <span class="text-[12px] text-outline block">Indicative Total</span>
            <span class="text-[20px] font-bold text-on-surface tabular-nums">${chosen.price}</span>
          </div>
        </div>
      </div>

      <div class="rounded-[24px] bg-surface-container-low p-5 shadow-sm flex flex-col gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-primary-fixed text-on-primary-fixed-variant flex items-center justify-center font-semibold">2</div>
          <div>
            <span class="text-[11px] font-semibold text-primary uppercase tracking-wider">Up Next</span>
            <h3 class="text-[17px] font-semibold text-on-surface">Your First Home</h3>
          </div>
        </div>
        <p class="text-[13px] text-on-surface-variant">Unlock UK tenancy guidance, Right to Rent preparation, and rental checklists tailored to your move.</p>
        <div class="relative h-28 rounded-2xl overflow-hidden flex items-end p-3">
          <svg viewBox="0 0 640 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" class="absolute inset-0 w-full h-full object-cover" aria-hidden="true"><defs><linearGradient id="flatW" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F5EFEA"/><stop offset="100%" stop-color="#E6DCF7"/></linearGradient><linearGradient id="winS" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D7ECFF"/><stop offset="100%" stop-color="#FCE9F2"/></linearGradient></defs><rect width="640" height="200" fill="url(#flatW)"/><rect x="210" y="20" width="220" height="145" rx="8" fill="url(#winS)" stroke="#FFFFFF" stroke-width="8"/><line x1="320" y1="20" x2="320" y2="165" stroke="#FFFFFF" stroke-width="6"/><line x1="210" y1="92" x2="430" y2="92" stroke="#FFFFFF" stroke-width="5"/><rect x="225" y="72" width="46" height="88" fill="#E8DFD5"/><rect x="275" y="65" width="44" height="95" fill="#F0E9E1"/><rect x="330" y="75" width="48" height="85" fill="#E5DCE8"/><rect x="382" y="68" width="40" height="92" fill="#EDE4DB"/><rect x="292" y="128" width="54" height="24" rx="4" fill="#DA2676"/><rect x="298" y="132" width="12" height="7" rx="1" fill="#E8F6FF"/><rect x="314" y="132" width="12" height="7" rx="1" fill="#E8F6FF"/><rect x="330" y="132" width="10" height="7" rx="1" fill="#E8F6FF"/><circle cx="304" cy="153" r="4.5" fill="#202D5D"/><circle cx="334" cy="153" r="4.5" fill="#202D5D"/><rect x="0" y="165" width="640" height="35" fill="#DCCCB9"/><rect x="360" y="126" width="180" height="50" rx="14" fill="#B8A9C9"/><rect x="376" y="114" width="44" height="32" rx="8" fill="#FFD9E2"/><rect x="430" y="116" width="42" height="30" rx="8" fill="#EADDFF"/><rect x="115" y="136" width="32" height="34" rx="6" fill="#00708A"/><ellipse cx="122" cy="116" rx="14" ry="22" transform="rotate(-18 122 116)" fill="#167B68"/><ellipse cx="140" cy="114" rx="13" ry="20" transform="rotate(20 140 114)" fill="#1F947E"/></svg>
          <div class="absolute inset-0 bg-gradient-to-t from-on-surface/75 via-on-surface/20 to-transparent"></div>
          <div class="relative z-10 flex items-center gap-2 text-white text-[13px] font-medium">
            <span class="material-symbols-outlined text-[18px]">lock_open</span>
            <span>Tenancy Guidance Unlocked</span>
          </div>
        </div>
      </div>

      <a href="journey.html" class="w-full h-14 rounded-full bg-gradient-to-r from-primary to-secondary text-on-primary font-semibold text-[15px] shadow-lg flex items-center justify-center gap-2 hover:opacity-95 transition-opacity">
        <span>Continue to Next Chapter</span>
        <span class="material-symbols-outlined text-[18px]">arrow_forward_ios</span>
      </a>
    `;
  }
</script>
</body>
</html>
