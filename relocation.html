<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Relocation Guide</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f1f5f9;
      color: #334155;
      padding: 2.5rem 1.25rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .route-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #e0f2fe;
      color: #0369a1;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 1.85rem;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }

    p.lead {
      color: #64748b;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .guide-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
      background-color: #f8fafc;
    }

    .guide-card h2 {
      font-size: 1.15rem;
      color: #0f172a;
      margin-bottom: 0.4rem;
    }

    .guide-card p {
      font-size: 0.925rem;
      color: #475569;
      line-height: 1.5;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1.5rem;
      text-decoration: none;
      color: #0284c7;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.15s ease;
    }

    .btn-back:hover {
      color: #0369a1;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .container {
        padding: 1.75rem 1.25rem;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <div id="routeBadge" class="route-pill">Relocation Pathway</div>
    <h1 id="pageHeading">Loading Journey...</h1>
    <p id="leadText" class="lead"></p>

    <section id="contentSections">
      <!-- Dynamic route items populated here -->
    </section>

    <a href="index.html" class="btn-back">&larr; Select different countries</a>
  </main>

  <script>
    // Friendly name map for display
    const countryNames = {
      "UK": "United Kingdom",
      "Pakistan": "Pakistan",
      "Australia": "Australia",
      "USA": "United States",
      "Switzerland": "Switzerland"
    };

    // Extract query parameters from URL
    const urlParams = new URLSearchParams(window.location.search);
    const fromCode = urlParams.get("from");
    const toCode = urlParams.get("to");

    const fromLabel = countryNames[fromCode] || fromCode;
    const toLabel = countryNames[toCode] || toCode;

    const headingEl = document.getElementById("pageHeading");
    const badgeEl = document.getElementById("routeBadge");
    const leadEl = document.getElementById("leadText");
    const contentEl = document.getElementById("contentSections");

    if (fromCode && toCode) {
      document.title = `${fromLabel} to ${toLabel} - Relocation Plan`;
      badgeEl.textContent = `${fromLabel} ➔ ${toLabel}`;
      headingEl.textContent = `Moving from ${fromLabel} to ${toLabel}`;
      leadEl.textContent = `Here is your preliminary roadmap and checklist for transitioning from ${fromLabel} to ${toLabel}.`;

      contentEl.innerHTML = `
        <div class="guide-card">
          <h2>1. Visa & Entry Formalities</h2>
          <p>Review current entry visa requirements and work permit pathways for relocating from ${fromLabel} into ${toLabel}. Ensure passport validity extends at least 6 months past your travel date.</p>
        </div>
        <div class="guide-card">
          <h2>2. Tax & Residency Status</h2>
          <p>Understand the transition from the tax residency framework in ${fromLabel} to the fiscal regulations applicable in ${toLabel}.</p>
        </div>
        <div class="guide-card">
          <h2>3. Healthcare & Insurance</h2>
          <p>Check the healthcare system structure in ${toLabel} and verify whether private health insurance or immediate statutory enrollment is mandatory.</p>
        </div>
        <div class="guide-card">
          <h2>4. Accommodation & Banking</h2>
          <p>Explore initial short-term accommodation options, bank account setup criteria, and currency exchange mechanisms for your move.</p>
        </div>
      `;
    } else {
      headingEl.textContent = "No Route Selected";
      leadEl.textContent = "Please return to the main page to choose your origin and destination countries.";
      badgeEl.style.display = "none";
    }
  </script>

</body>
</html>
